services:
  postgres:
    image: postgres:16
    container_name: deudamundi-postgres
    environment:
      POSTGRES_DB: deudamundi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deudamundi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: deudamundi-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
    container_name: deudamundi-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    # Force the start script to be executed via sh so mounts without exec bit still run
    command: sh -c "./scripts/start_api.sh"
    volumes:
      - ./api:/app:z
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: node:20-alpine
    container_name: deudamundi-web
    working_dir: /app
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app:z
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  web_node_modules:
