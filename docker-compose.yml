services:
  postgres:
    image: postgres:16
    container_name: deudamundi-postgres
    environment:
      POSTGRES_DB: deudamundi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: deudamundi-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
    container_name: deudamundi-api
    env_file:
      - ./api/.env
    # Force the start script to be executed via sh so mounts without exec bit still run
    command: sh -c "./scripts/start_api.sh"
    volumes:
      - ./api:/app:z
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  web:
    image: node:20-alpine
    container_name: deudamundi-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app:z
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
